name: Release Cross Static Builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Push builds live in Agent Tests. A release waits for a matching push run and
# reuses its fully tested artifacts; an absent/failed/expired run triggers CI.
jobs:
  resolve:
    name: Resolve tested release commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      run-id: ${{ steps.reuse.outputs.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 1
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find an exact, fully tested artifact set
        id: reuse
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          result-encoding: string
          script: |
            const findTestedRun = require('./tools/ci/find-tested-run.cjs');
            const targets = require('./tools/ci/targets.json');
            return await findTestedRun({github, context, core,
              sha: process.env.RELEASE_SHA, isas: targets.map(t => t.isa)});

  build:
    name: Build and test missing release artifacts
    needs: resolve
    if: needs.resolve.outputs.run-id == ''
    uses: ./.github/workflows/agent-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      force-full: true
    secrets: inherit

  stage:
    name: Prepare verified release assets
    needs: [resolve, build]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' &&
          (needs.resolve.outputs.run-id != '' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run-id || github.run_id }}
          pattern: ela-*
          path: tested-artifacts
      - name: Download successful test manifest
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run-id || github.run_id }}
          name: tested-commit
          path: tested-artifacts/tested-commit
      - name: Verify commit and complete architecture coverage
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 tools/ci/stage-release.py
      - name: Write release metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          mkdir -p release-metadata
          printf '%s\n' "$RELEASE_TAG" > release-metadata/tag.txt
      - uses: actions/upload-artifact@v7
        with:
          name: publish-release-assets
          path: release-assets
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: publish-release-metadata
          path: release-metadata/tag.txt
          if-no-files-found: error
