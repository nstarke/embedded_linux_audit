name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  analyze-c:
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' }}
    name: Analyze (c-cpp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize required dependency sources
        run: bash tools/ci/checkout-submodules.sh native

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make autoconf automake cmake libtool-bin libltdl-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          queries: security-and-quality
          # Excludes path-injection / system-data-exposure, which fire on the
          # agent's by-design operator-directed file/network access. C only —
          # the JavaScript job below is unaffected.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        run: make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: c-cpp

  analyze-javascript:
    needs: changes
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: javascript-typescript
