name: Coverity Scan

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * 1'   # weekly, Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  coverity:
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' }}
    name: Coverity Scan (C/C++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize required dependency sources
        run: bash tools/ci/checkout-submodules.sh native

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make autoconf automake cmake libtool-bin libltdl-dev

      - name: Coverity Scan
        uses: vapier/coverity-scan-action@v1
        with:
          project: nstarke/embedded_linux_audit
          token: ${{ secrets.COVERITY_SCAN_TOKEN }}
          email: ${{ secrets.COVERITY_SCAN_EMAIL }}
          build_language: cxx
          build_platform: linux64
          command: make
          cov_options: --exclude-file "third_party/.*"

