name: Agent Tests

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
        description: Exact source commit to test
      force-full:
        type: boolean
        default: false
        description: Run all checks, including for a release fallback

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      force-full: ${{ inputs.force-full || false }}

  agent-unit-c:
    name: tests/agent/unit-c
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Initialize required dependency sources
        run: bash tools/ci/checkout-submodules.sh unit
      - name: Install C unit test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake
      - name: Run native C unit tests
        run: |
          set -euo pipefail
          make test-unit-agent-c

  kmod-build:
    name: kmod/host-headers-build
    needs: changes
    if: ${{ needs.changes.outputs.kmod == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Install kernel headers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)"
      - name: Build kernel module against host headers
        run: |
          set -euo pipefail
          make -C kmod
          modinfo kmod/ela_kmod.ko
          modinfo -F vermagic kmod/ela_kmod.ko

  agent-c-coverage:
    name: coverage/agent-c
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Initialize required dependency sources
        run: bash tools/ci/checkout-submodules.sh static
      - name: Install native coverage dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake libtool-bin libltdl-dev llvm lcov
      - name: Run native C coverage
        run: |
          set -euo pipefail
          make coverage-agent-c
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: generated/coverage/agent-c.lcov.info
          flags: agent-c
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  agent-api-jest:
    name: tests/api/agent/jest
    needs: changes
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS test dependencies
        run: |
          set -euo pipefail
          npm install
      - name: Run agent API Jest tests
        run: |
          set -euo pipefail
          node_modules/.bin/jest --runInBand --coverage tests/unit/api/agent tests/unit/api/lib tests/unit/api/builder tests/unit/api/client
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: agent
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  gdb-api-jest:
    name: tests/api/gdb/jest
    needs: changes
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS test dependencies
        run: |
          set -euo pipefail
          npm install
      - name: Run GDB API Jest tests
        run: |
          set -euo pipefail
          node_modules/.bin/jest --runInBand --coverage tests/unit/api/gdb
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: gdb
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  terminal-api-jest:
    name: tests/api/terminal/jest
    needs: changes
    if: ${{ needs.changes.outputs.javascript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS test dependencies
        run: |
          set -euo pipefail
          npm install
      - name: Run terminal API Jest tests
        run: |
          set -euo pipefail
          node_modules/.bin/jest --runInBand --coverage tests/unit/api/terminal
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: terminal
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  architectures:
    name: ${{ matrix.isa }}
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/ci-isa.yml
    with:
      ref: ${{ needs.changes.outputs.sha }}
      isa: ${{ matrix.isa }}
      zig-targets: ${{ matrix.zig_targets }}

  qemu-summary:
    name: tests/agent/qemu-summary
    needs:
      - changes
      - architectures
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download QEMU logs
        if: ${{ needs.changes.outputs.agent == 'true' && needs.architectures.result != 'skipped' }}
        uses: actions/download-artifact@v4
        with:
          pattern: qemu-log-*
          path: qemu-logs
      - name: Summarize architecture checks
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          AGENT_REQUIRED: ${{ needs.changes.outputs.agent }}
          RESULT: ${{ needs.architectures.result }}
        run: |
          echo "Architecture checks: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SELECTION_RESULT" != success ]; then exit 1; fi
          if [ "$AGENT_REQUIRED" = true ] && [ "$RESULT" != success ]; then exit 1; fi
          if [ -d qemu-logs ]; then
            find qemu-logs -type f -name '*.log' -print -exec tail -n 4 {} \; >> "$GITHUB_STEP_SUMMARY"
          fi

  required:
    name: CI / required
    needs:
      - changes
      - agent-unit-c
      - kmod-build
      - agent-c-coverage
      - agent-api-jest
      - gdb-api-jest
      - terminal-api-jest
      - architectures
      - qemu-summary
      - pipeline-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Check all selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci/check-required.py

  tested-artifacts:
    name: Record fully tested artifacts
    needs:
      - changes
      - required
    if: ${{ needs.changes.outputs.agent == 'true' && needs.changes.outputs.javascript == 'true' && needs.changes.outputs.kmod == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - name: Record tested commit
        env:
          TESTED_SHA: ${{ needs.changes.outputs.sha }}
        run: |
          mkdir -p tested-commit
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          Path('tested-commit/commit.json').write_text(json.dumps({'schema': 1, 'sha': os.environ['TESTED_SHA']}))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: tested-commit
          path: tested-commit/commit.json
          if-no-files-found: error

  pipeline-tests:
    name: tests/ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test CI selection, caching and release guards
        run: |
          python3 tests/ci/test_ci.py
          node --test tests/ci/find-tested-run.test.cjs
          bash -n tools/ci/build-isa.sh tools/ci/checkout-submodules.sh
